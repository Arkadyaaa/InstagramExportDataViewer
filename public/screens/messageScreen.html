<div class="container">
	<aside class="messageSidebar">
		<h3>Messages</h3>

		<div class="chatSidebar">
            <div id="chatItems" class="chatItems">
                <div class="emptyState">
                    Loading conversations...
                </div>
            </div>
		</div>
	</aside>

	<main id="conversation">

		<div id="messages" class="messages">
			<div class="emptyState">Select a conversation to view messages.</div>
		</div>
	</main>
</div>
