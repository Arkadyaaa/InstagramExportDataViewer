<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Instagram Export Viewer</title>

		<link rel="stylesheet" href="css/main.css" />
		<link rel="stylesheet" href="css/topbar.css" />
		<link rel="stylesheet" href="css/sidebar.css" />
		<link rel="stylesheet" href="css/messages.css" />
		<link rel="stylesheet" href="css/cards.css" />
		<link
			rel="stylesheet"
			href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css"
		/>
	</head>

	<body>
		<header class="topbar">
			<div class="logo">
				<i class="mdi mdi-instagram"></i> Instagram Export Viewer
			</div>
		</header>

		<div class="container">
			<aside class="sidebar">
				<h3>Categories</h3>

				<div class="dropdown">
					<button class="dropdown-toggle">
						<i class="mdi mdi-account-group"></i>
						Connections
						<i class="mdi mdi-chevron-down"></i>
					</button>

					<div id="connectionFiles" class="dropdown-content">
						Loading...
					</div>
				</div>

				<div class="dropdown">
					<button class="dropdown-toggle">
						<i class="mdi mdi-send"></i>
						Messages
						<i class="mdi mdi-chevron-down"></i>
					</button>

					<div id="messageFiles" class="dropdown-content">
						Loading...
					</div>
				</div>
			</aside>

			<main id="mainContent"></main>
		</div>

		<script>
			document.querySelectorAll(".dropdown").forEach((dropdown) => {
				const button = dropdown.querySelector(".dropdown-toggle");
				const content = dropdown.querySelector(".dropdown-content");

				button.addEventListener("click", () => {
					content.classList.toggle("open");
				});
			});

			document.addEventListener("DOMContentLoaded", () => {
				loadMessageSidebar();
			});
		</script>


		<script src="js/connections.js"></script>
		<script src="js/messages.js"></script>
		<script src="js/app.js"></script>

		<script>
			loadScreen("connectionsScreen");
		</script>
        
	</body>
</html>
